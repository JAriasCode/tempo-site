  <path d="M74 150 L126 150 L100 134 Z" fill="#A9D6E5"/>
  <!-- bottom cap: winged crystal bar, pointed -->
  <path d="M54 150 L146 150 L158 160 L100 180 L42 160 Z" fill="#39D2E8"/>
