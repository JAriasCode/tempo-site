  <path d="M100 102 L100 112 L92 119 L108 128 L100 134 L100 141" fill="none" stroke="#F2F6F8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- bottom chamber: filling with sand -->
